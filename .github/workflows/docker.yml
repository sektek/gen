name: Docker

on:
  workflow_dispatch:
    inputs:
      gen_version:
        description: "@sektek/gen version to install in the image (also the image tag)"
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "sektek/devcontainers"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GEN_VERSION=${{ inputs.gen_version }}
          tags: "${{ vars.DOCKER_USER }}/gen:${{ inputs.gen_version }}"
          push: true
